<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <title>MonShop - Fiche produit</title>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="images/logo/1.png" alt="MonShop - Logo" class="logo-img"></a>
        </div>
        <nav>
            <a href="index.html">Acceuil</a>
            <a href="produits.html">produits</a>
            <a href="panier.html">panier</a>
            <a href="connexion.html">Se connecter</a>
            <a href="inscription.html">S'inscrire</a>
        </nav>
    </header>

    <!-- contenu principal -->
     <main>
        <div class="fiche-produit">
            <div class="fiche-image">
                <img src="images/produits/produit1.jpg" alt="T-shirt">
            </div>
            <div class="fiche-details">
                <h1>T-shirt</h1>
                <p class="prix">25,00 £</p>
                <p class="description">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Voluptatem, doloremque.</p>
                <div class="quantite">
                    <label for="qte">Quantité</label>
                    <input type="number" id="qte" value="1" min="1" max="10">
                </div>
                <a href="#" class="btn-ajouter">Ajouter au panier</a>
                <a href="produits.html" class="btn-retour">Retour au catalogue</a>
            </div>
        </div>
     </main>

     <!-- footer -->
    <footer>
        <div class="footer-contenu">
            <p>&copy; 2026 MonShop. Tous droits réservés</p>
            <div class="footer-liens">
                <a href="a-propos.html">A propos</a>
                <a href="mentions-legales.html">Mentions légales</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="footer-sociaux">
                <a href="#">Github</a>
                <a href="#">Linkedin</a>
                <a href="#">Twitter</a>
            </div>
        </div>
     </footer>
</body>
