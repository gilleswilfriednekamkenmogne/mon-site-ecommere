<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <title>MonShop - contacter nous</title>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="images/logo/1.png" alt="MonShop - Logo" class="logo-img"></a>
        </div>
        <nav>
            <a href="index.html">Acceuil</a>
            <a href="produits.html">produits</a>
            <a href="panier.html">panier</a>
            <a href="connexion.html">Se connecter</a>
            <a href="inscription.html">S'inscrire</a>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <h1 class="page-title">Contactez-nous</h1>
            <div class="contact-box">
                <form>
                    <label for="nom-contact">Nom complet</label>
                    <input type="text" id="nom-contact" placeholder="Votre nom">
                    <label for="email-contact">Email</label>
                    <input type="email" id="email-contact" placeholder="Votre email">
                    <label for="objet-contact">Objet</label>
                    <input type="text" id="objet-contact" placeholder="objet de votre message ici">
                    <label for="message-contact">Message</label>
                    <textarea name="message-contact" id="message-contact" rows="5" placeholder="Votre message"></textarea>
                    <button type="submit" class="btn-ajouter">Envoyer</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-contenu">
            <p>&copy; 2026 MonShop. Tous droits réservés</p>
            <div class="footer-liens">
                <a href="a-propos.html">A propos</a>
                <a href="mentions-legales.html">Mentions légales</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="footer-sociaux">
                <a href="#">Github</a>
                <a href="#">Linkedin</a>
                <a href="#">Twitter</a>
            </div>
        </div>
     </footer>
</body>
</html>
