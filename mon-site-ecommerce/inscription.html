    <link rel="stylesheet" href="css/style.css">
    <title>MonShop - Inscription</title>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="images/logo/1.png" alt="MonShop - Logo" class="logo-img"></a>
        </div>
        <nav>
            <a href="index.html">Acceuil</a>

            <a href="inscription.html">S'inscrire</a>
        </nav>
    </header>

    <!-- contenu principale -->
    <main>
        <div class="auth-container">
            <div class="auth-box">
                <h1>Inscription</h1>
                <form>
                    <label for="nom-inscription">Nom complet</label>
                    <input type="text" id="nom-inscription" placeholder="Votre nom">
                    <label for="email-inscription">Email</label>
                    <input type="email" id="email-inscription" placeholder="Votre email">
                    <label for="password-inscription">Mot de passe</label>
                    <input type="password" id="password-inscription" placeholder="Votre mot de passe">
                    <label for="password-confirm">Confirmer votre mot de passe</label>
                    <input type="password" id="password-confirm" placeholder="Confirmer votre mot de passe">
                    <button type="submit" class="btn-ajouter">S'inscrire</button>
                </form>
                <p class="auth-lien">Déja un compte ? <a href="connexion.html">Se connecter</a></p>
            </div>
        </div>
    </main>

    <footer>

     </footer>
